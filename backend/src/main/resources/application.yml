spring:
  application:
    name: splitledger
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: framework   # behind Caddy

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Off until email verification ships (SL-901). Lets the app go live in S6 unexposed.
  registration-enabled: ${REGISTRATION_ENABLED:false}
  payments:
    # The only method that can reach a real bank account. Off wherever data is
    # fictional, which is everywhere in this product (ADR-013).
    upi-intent-enabled: ${PAYMENTS_UPI_INTENT_ENABLED:false}

---
# Publishing the full surface of a money API to the internet buys nothing
# and costs reconnaissance (finding C19).
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
