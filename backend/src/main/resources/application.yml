spring:
  # .env is the documented place for local credentials (README, check-env.sh), but
  # nothing was reading it into the environment, so ${DB_URL} resolved to nothing
  # and the documented `./mvnw spring-boot:run` could not start. Both paths are
  # listed because the app is run from backend/ and occasionally the repo root.
  # 'optional:' keeps CI working, where there is no .env and the pipeline exports
  # the variables itself.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: splitledger
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # The managed dev instance (Neon, ADR-012) suspends its compute after five
      # minutes without queries and drops the connections it was holding. A pool
      # that keeps idle connections past that point hands out a dead socket on
      # the next request. Reaping them first instead means the request after a
      # suspend opens a fresh connection and wakes the compute, which costs a few
      # hundred milliseconds and nothing else.
      #
      # Deliberately not keepalive-time: pinging to hold the compute awake would
      # defeat scale-to-zero and spend the monthly compute allowance on nothing.
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:120000}     # 2 min, inside the 5-min suspend
      max-lifetime: ${DB_POOL_MAX_LIFETIME:600000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: framework   # behind Caddy

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Without this, diagnosing a DOWN means guessing which component failed.
      # Turned off again in the prod profile below.
      show-details: always
  health:
    redis:
      # Redis is optional (ADR-015): the deployed runtime uses an in-process cache, and
      # the design already requires that a cache outage degrade to the database rather
      # than fail a request. It must therefore not fail the health check either --
      # otherwise /actuator/health reports DOWN on a perfectly healthy app and the
      # deployment smoke test rolls back every single release. Re-enable this if and
      # when a second app instance makes shared Redis a real dependency.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cache:
    # With a blank REDIS_URL these caches are created in-process, in this application's
    # own heap (ADR-015), so each one states how large it may get and how stale it may
    # serve. There is no default and no unlimited: an undeclared cache does not exist,
    # and a declared one is always bounded.
    caches:
      # LLD section 13: bal:{groupId} -> net + pairwise + simplified balances, 5 minutes,
      # invalidated on commit of anything that moves a balance. 10k groups of cached
      # balances is far more than this deployment will hold and still a bounded number.
      bal:
        maximum-size: ${CACHE_BAL_MAX_SIZE:10000}
        time-to-live: ${CACHE_BAL_TTL:5m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    # Short on purpose: there is no revocation list, so this is the window in which a
    # stolen access token stays usable (ADR-011).
    access-ttl: PT15M
  idempotency:
    # How long a completed key is replayable. Comfortably longer than any retry a client
    # would still be making, and short enough that the table stays small.
    retention: ${IDEMPOTENCY_RETENTION:PT24H}
    # A claim this old means the process died mid-request; a clean failure releases its
    # own claim immediately.
    claim-timeout: ${IDEMPOTENCY_CLAIM_TIMEOUT:PT10M}
    purge-cron: ${IDEMPOTENCY_PURGE_CRON:0 */15 * * * *}
  settlements:
    # Every minute (LLD 7.1). The deadlines themselves live on the payment method, which
    # is where the reason for them lives.
    expiry-cron: ${SETTLEMENT_EXPIRY_CRON:0 * * * * *}
  invites:
    # A week: long enough to be passed on and acted upon, short enough that a link
    # forwarded into some group chat stops working.
    ttl: ${INVITE_TTL:P7D}
    # Points at the frontend, not the API -- the token is redeemed from a page. Must match
    # where the app is actually served, or every invite link will 404.
    base-url: ${INVITE_BASE_URL:http://localhost:5173}
  auth:
    refresh-ttl: P7D
    # Off locally so the cookie works over plain HTTP; forced on in prod below.
    cookie-secure: ${COOKIE_SECURE:false}
  rate-limit:
    # LLD section 12. Tight on purpose: these guard credential endpoints, and no
    # legitimate user logs in five times a minute or creates five accounts an hour.
    # In-process, so with a second instance each would allow the full quota -- this moves
    # to a shared store when the cache does (ADR-015).
    limits:
      login:
        capacity: 5
        per: PT1M
      register:
        capacity: 5
        per: PT1H
      # Keyed by admin id, not IP. An invitation puts mail in someone else's inbox, so
      # the cap is about not making this a spam relay; 20 an hour is far more than
      # filling in a real group and far less than a useful blast.
      invite-create:
        capacity: 20
        per: PT1H
      # The only unauthenticated invite endpoint. The token is 256 bits so guessing is
      # hopeless, but an uncapped public lookup is free to script against.
      invite-lookup:
        capacity: 30
        per: PT1M
  # Off until email verification ships (SL-901). Lets the app go live in S6 unexposed.
  # Read at startup, so flipping it needs the container restarted -- not a release, not a
  # rebuild, and recoverable in seconds if a demo turns into an incident.
  registration-enabled: ${REGISTRATION_ENABLED:false}
  limits:
    # Per-account caps (SL-906, risk R13). Not authorisation -- these bound what one
    # account can cost in storage, writes and bill before anyone notices. Every number is
    # far above any honest use of a demo and far below anything that hurts.
    groups-per-account: ${LIMIT_GROUPS_PER_ACCOUNT:20}
    # Matched to SplitLimits.MAX_PARTICIPANTS on purpose: an expense can be split between
    # at most 50 people, so a 51st member is someone who could never be in a whole-group
    # split. Divergence here would be a group whose own expenses cannot include everyone.
    members-per-group: ${LIMIT_MEMBERS_PER_GROUP:50}
    # Rolling 24 hours, counting voided rows too (AccountLimits).
    expenses-per-day: ${LIMIT_EXPENSES_PER_DAY:200}
  payments:
    # The only method that can reach a real bank account. Off wherever data is
    # fictional, which is everywhere in this product (ADR-013).
    upi-intent-enabled: ${PAYMENTS_UPI_INTENT_ENABLED:false}
    sandbox:
      # The demo's stand-in gateway. On by default: without it nothing in this product
      # can be settled through a gateway path at all, which is the one thing a reviewer
      # will want to see working (finding B4).
      auto-confirm-enabled: ${SANDBOX_AUTO_CONFIRM:true}
      # Long enough that PENDING is a state someone actually sees, short enough that a
      # demo does not stall waiting for it.
      auto-confirm-delay: ${SANDBOX_AUTO_CONFIRM_DELAY:PT10S}
    # How often settlement asks polling providers whether their orders went through.
    poll-cron: ${PAYMENTS_POLL_CRON:*/5 * * * * *}
    razorpay:
      # Test-mode keys (SL-601). Absent by default, and the provider is then not a bean at
      # all: the demo has to start and settle through the sandbox without an account
      # (ADR-013). key-id is public -- Checkout needs it in the browser -- and key-secret
      # never leaves the server.
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      # A third secret, separate from the key pair: Razorpay signs webhook deliveries with
      # the value configured in their dashboard. With it unset every delivery is refused,
      # which is the safe direction -- the alternative is a public endpoint that believes
      # whatever arrives (SL-603).
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      # Overridable so a test can point at a stub. Changing it in production needs the
      # deployment's own configuration, which is the same trust boundary as the key.
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
      connect-timeout: ${RAZORPAY_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${RAZORPAY_READ_TIMEOUT:PT10S}

---
# Publishing the full surface of a money API to the internet buys nothing
# and costs reconnaissance (finding C19).
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoint:
    health:
      show-details: never
app:
  auth:
    cookie-secure: true
