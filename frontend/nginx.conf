server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Every route is client-side, so a deep link must return index.html rather than a 404 --
  # otherwise refreshing on /groups/<id> breaks the app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames, so they can be cached hard. index.html deliberately is not: it is
  # the file that points at the new hashes, and a cached one pins a browser to the old
  # build indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # nginx advertises its version on every response and every error page by default,
  # which tells a scanner exactly which CVEs to try.
  server_tokens off;
}
